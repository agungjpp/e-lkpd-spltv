var E=[[2,1,1,27],[1,3,2,28],[3,2,3,47]],TV=[10,4,3],VN=['x','y','z'],PAIRS=[[0,1],[0,2],[1,2]];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a||1}
function pairRes(v){
  var rem=[0,1,2].filter(function(i){return i!==v});
  return PAIRS.map(function(p){
    var A=E[p[0]],B=E[p[1]],r=[],k;
    for(k=0;k<4;k++)r.push(B[v]*A[k]-A[v]*B[k]);
    var vec=[r[rem[0]],r[rem[1]],r[3]],g=gcd(gcd(vec[0],vec[1]),vec[2]);
    vec=vec.map(function(x){return x/g});
    var f=vec[0]!==0?vec[0]:vec[1];if(f<0)vec=vec.map(function(x){return -x});
    return {p:p,vec:vec,rem:rem};
  });
}

function pn(s){s=String(s).trim().replace(',','.').replace(/\u2212/g,'-');var m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);return(s===''||isNaN(Number(s)))?NaN:Number(s)}
var STEPS=[
{n:'Panduan',e:'📖',i:'det',h:'Buku Panduan Detektif',g:'Baca 1 menit, lalu gas!',html:'<p>Halo, Detektif Muda! 👋 Ini lembar kerja digitalmu. Yuk kenalan dulu sama cara mainnya.</p><h3 class="hh">🚀 Alur misi</h3><ol><li><b>Daftarkan timmu.</b> Isi nama tim di bagian atas halaman (wajib, biar laporan PDF bisa diunduh).</li><li><b>Ikuti peta misi.</b> Kerjakan Tujuan, Kasus, lalu Misi 1 sampai Bonus secara berurutan bersama timmu.</li><li><b>Tulis, lalu periksa.</b> Setiap soal punya tombol Periksa jawaban sendiri.</li><li><b>Bebas pilih jalur!</b> Di Misi 3 kamu boleh melenyapkan <b>x, y, atau z</b> duluan, dengan pasangan persamaan yang mana saja. e-LKPD mengecek sesuai pilihanmu.</li><li><b>Misi tuntas?</b> Buka tab <b>Lapor</b>, unduh laporan PDF, lalu serahkan ke Komandan (gurumu).</li></ol><h3 class="hh">🎮 Kenalan sama tombol-tombolnya</h3><div class="gd"><div><span class="mk">🔎</span><span class="mk dn">⭐</span><span class="mk on">💥</span></div><div><b>Peta misi</b> (deretan bulatan di bagian atas). Ketuk satu bulatan untuk loncat ke misi itu. Bulatan yang <b>berdenyut</b> = posisimu sekarang, <b>⭐ hijau</b> = misi sudah beres. Geser peta ke kiri atau kanan untuk melihat misi lainnya.</div><div><span class="dk g sm">◀ Kembali</span></div><div>Balik ke halaman sebelumnya. Tombol ini ada di <b>bar bawah layar</b> dan selalu menempel di sana.</div><div><span class="dk sm">Lanjut ▶</span><span class="dk ready sm">Lanjut ▶</span></div><div>Pindah ke halaman berikutnya. Kalau tombolnya berubah jadi <b>oranye dan berdenyut</b>, artinya semua soal di misi itu sudah kamu periksa. Waktunya lanjut!</div><div><span class="mk">👆</span></div><div><b>Geser layar</b> ke kiri untuk lanjut dan ke kanan untuk kembali (di HP). Di laptop, pakai tombol panah ← →. Gerakan ini tidak jalan saat kamu sedang mengetik.</div><div><span class="btn s">Periksa jawaban</span></div><div>Ada di bawah setiap soal. Tekan setelah selesai menulis. Soal angka dan pilihan dicek otomatis, sedangkan soal uraian menampilkan <b>Jawaban Markas Pusat</b> untuk kamu bandingkan.</div><div><span class="mi ok">10</span><span class="mi bad">3</span></div><div><b>Lampu hasil periksa:</b> kotak <span style="color:var(--ok)"><b>hijau</b></span> = tepat sasaran, kotak <span style="color:var(--warn)"><b>kuning</b></span> = ada yang janggal, hitung ulang lalu periksa lagi. Boleh berkali-kali! Catatan Markas Pusat muncul kalau semua benar atau setelah cek kedua.</div><div><span class="btn g s">✓ Cocok</span><span class="btn g s">✎ Perbaiki</span></div><div>Muncul di soal uraian setelah kamu membuka jawaban Markas Pusat. Pilih sesuai penilaianmu sendiri. Jujur ya, ini buat belajarmu!</div><div><span class="btn g s">💡 Petunjuk 1</span></div><div>Ketuk untuk membuka petunjuk, satu per satu. Diskusikan dulu minimal 3 menit sebelum membukanya!</div><div><span class="mk" style="padding:0 12px;border-radius:99px">⭐ 50 XP</span></div><div><b>XP dan pangkat</b> (di bagian atas halaman). Makin banyak soal tepat, makin tinggi pangkatmu: Magang, Handal, Senior, sampai Legendaris.</div><div><span class="btn or sm">⬇ Unduh laporan</span></div><div>Ada di tab <b>Lapor</b> (misi terakhir). Laporan PDF akan tersimpan di folder Unduhan. Kirim file itu ke gurumu.</div></div><div class="box">💾 <b>Progres tersimpan otomatis</b> di perangkat ini. Pakai satu perangkat dan satu browser yang sama, jangan mode samaran. Salah hitung itu biasa, detektif keren belajar dari jejak yang keliru! 🔍</div>'},
{n:'Tujuan',e:'🎯',i:'lens',h:'Tujuan Misi Hari Ini',g:'Tujuan Pembelajaran',tip:'Sebelum menyelidik, kenalan dulu sama tujuan misinya biar tahu kita mau ke mana!',html:'<p>Setelah mengikuti pembelajaran ini, kamu diharapkan mampu:</p><div class="tj"><b>1</b><div>Mengidentifikasi variabel dan informasi pada masalah kontekstual untuk membentuk model matematika berupa SPLTV dengan tepat.<small>Artinya: baca masalahnya, lalu ubah jadi tiga persamaan.</small><small>Dilatih di: Kegiatan 1 dan 2</small></div></div><div class="tj"><b>2</b><div>Menentukan penyelesaian SPLTV menggunakan metode eliminasi dan substitusi secara runtut.<small>Artinya: lenyapkan variabel, lalu bongkar sisanya, langkah demi langkah.</small><small>Dilatih di: Kegiatan 3 dan 4</small></div></div><div class="tj"><b>3</b><div>Memeriksa kebenaran penyelesaian SPLTV dengan mensubstitusikannya ke seluruh persamaan, serta menafsirkan penyelesaian sesuai konteks masalah.<small>Artinya: uji hasilmu di semua persamaan, lalu maknai sebagai harga dan kembalian.</small><small>Dilatih di: Kegiatan 5 dan 6</small></div></div><div class="tj"><b>4</b><div>Menyajikan dan menyimpulkan strategi serta hasil penyelesaian masalah secara lisan maupun tulisan.<small>Artinya: ceritakan strategi timmu dan rumuskan jurus umumnya.</small><small>Dilatih di: Kegiatan 6 dan 7</small></div></div><div class="box">Tenang, tujuan-tujuan ini akan kamu capai pelan-pelan lewat 7 kegiatan seru. Siap menyelidik? 🕵️</div>'},

var RK=[[150,'Detektif Legendaris'],[100,'Detektif Senior'],[50,'Detektif Handal'],[0,'Detektif Magang']];

var tx=0,ty=0;
